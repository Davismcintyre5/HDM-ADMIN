<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100">
  <rect width="800" height="1100" fill="#ffffff"/>

  <!-- Letterhead bar -->
  <rect x="0" y="0" width="800" height="6" fill="#0a1628"/>
  <text x="60" y="60" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0a1628">HDM TECHNOLOGIES</text>
  <text x="60" y="82" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4b5563">Building Digital Solutions for Africa</text>
  <text x="60" y="100" font-family="Georgia, serif" font-size="10" fill="#374151">P.O. Box 2460-20100, Nakuru, Kenya</text>
  <text x="60" y="114" font-family="Georgia, serif" font-size="10" fill="#1e6ef0">info@hdmtechnologies.com · www.hdm.co.ke</text>

  <line x1="60" y1="135" x2="740" y2="135" stroke="#0a1628" stroke-width="1.5"/>

  <!-- MEMO title -->
  <text x="400" y="185" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#0a1628" letter-spacing="4">MEMORANDUM</text>
  <line x1="300" y1="200" x2="500" y2="200" stroke="#1e6ef0" stroke-width="1"/>

  <!-- Memo fields -->
  <g font-family="Georgia, serif" font-size="13" fill="#1f2937">
    <text x="60" y="250" font-weight="700">TO:</text>
    <text x="200" y="250">All Staff</text>

    <text x="60" y="275" font-weight="700">FROM:</text>
    <text x="200" y="275">The Managing Director</text>

    <text x="60" y="300" font-weight="700">CC:</text>
    <text x="200" y="300">Department Heads</text>

    <text x="60" y="325" font-weight="700">DATE:</text>
    <text x="200" y="325">22 October 2026</text>

    <text x="60" y="350" font-weight="700">SUBJECT:</text>
    <text x="200" y="350" font-weight="700" fill="#0a1628">New Company Policy</text>
  </g>

  <line x1="60" y1="370" x2="740" y2="370" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Body -->
  <g font-family="Georgia, serif" font-size="13" fill="#1f2937">
    <text x="60" y="410">This is to inform all staff that effective immediately...</text>
    <text x="60" y="435">the following policies will apply to all departments...</text>
    <text x="60" y="460">Please read the attached document carefully...</text>

    <text x="60" y="500">1. Policy point one</text>
    <text x="60" y="525">2. Policy point two</text>
    <text x="60" y="550">3. Policy point three</text>

    <text x="60" y="600">For any questions, contact the HR department.</text>
  </g>

  <!-- Signature -->
  <text x="60" y="750" font-family="Georgia, serif" font-size="13" fill="#1f2937">Yours faithfully,</text>
  <line x1="60" y1="850" x2="220" y2="850" stroke="#0a1628" stroke-width="1"/>
  <text x="60" y="870" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0a1628">Davix H. McIntyre</text>
  <text x="60" y="888" font-family="Georgia, serif" font-size="11" fill="#4b5563">Managing Director</text>

  <!-- Stamp placeholder (right) -->
  <circle cx="650" cy="820" r="55" fill="none" stroke="#1e6ef0" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4"/>
  <text x="650" y="823" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#1e6ef0" opacity="0.6">STAMP</text>

  <!-- Footer -->
  <line x1="60" y1="1000" x2="740" y2="1000" stroke="#e5e7eb" stroke-width="0.5"/>
  <text x="400" y="1020" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#6b7280">© 2026 HDM Technologies. Internal communication.</text>
</svg>