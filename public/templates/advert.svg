<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100">
  <rect width="800" height="1100" fill="#0a1628"/>

  <!-- Decorative corner accents -->
  <rect x="30" y="30" width="740" height="1040" fill="none" stroke="#1e6ef0" stroke-width="1" opacity="0.4"/>
  <rect x="40" y="40" width="720" height="1020" fill="none" stroke="#1e6ef0" stroke-width="0.5" opacity="0.2"/>

  <!-- Top logo -->
  <text x="400" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="6" fill="#93c5fd">HDM TECHNOLOGIES</text>
  <line x1="340" y1="115" x2="460" y2="115" stroke="#1e6ef0" stroke-width="1"/>

  <!-- Giant headline -->
  <text x="400" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="4">HDM AI</text>
  <text x="400" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#93c5fd">The future of intelligence</text>

  <!-- Feature grid -->
  <g font-family="Georgia, serif" fill="#ffffff">
    <!-- Feature 1 -->
    <circle cx="200" cy="400" r="50" fill="#1e6ef0" opacity="0.15"/>
    <text x="200" y="408" text-anchor="middle" font-size="28">🧠</text>
    <text x="200" y="480" text-anchor="middle" font-size="13" font-weight="700">Smart Chat</text>
    <text x="200" y="500" text-anchor="middle" font-size="11" fill="#93c5fd">Natural language</text>

    <!-- Feature 2 -->
    <circle cx="400" cy="400" r="50" fill="#1e6ef0" opacity="0.15"/>
    <text x="400" y="408" text-anchor="middle" font-size="28">⚡</text>
    <text x="400" y="480" text-anchor="middle" font-size="13" font-weight="700">Lightning Fast</text>
    <text x="400" y="500" text-anchor="middle" font-size="11" fill="#93c5fd">Instant responses</text>

    <!-- Feature 3 -->
    <circle cx="600" cy="400" r="50" fill="#1e6ef0" opacity="0.15"/>
    <text x="600" y="408" text-anchor="middle" font-size="28">🎨</text>
    <text x="600" y="480" text-anchor="middle" font-size="13" font-weight="700">Create Anything</text>
    <text x="600" y="500" text-anchor="middle" font-size="11" fill="#93c5fd">Text, images, code</text>
  </g>

  <!-- Central banner -->
  <rect x="100" y="580" width="600" height="120" fill="#1e6ef0" rx="8"/>
  <text x="400" y="625" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#ffffff">Powered by</text>
  <text x="400" y="660" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#ffffff">HDM NOVA MODEL</text>
  <text x="400" y="685" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#bfdbfe">State-of-the-art AI · Trained for Africa</text>

  <!-- Details -->
  <g font-family="Georgia, serif" fill="#ffffff" text-anchor="middle">
    <text x="400" y="760" font-size="14" fill="#93c5fd" letter-spacing="3">AVAILABLE NOW</text>
    <text x="400" y="800" font-size="22" font-weight="700">www.hdm.co.ke/ai</text>
    <text x="400" y="835" font-size="12" fill="#93c5fd">Start free · No credit card required</text>
  </g>

  <!-- Contact bar -->
  <rect x="100" y="900" width="600" height="60" fill="#ffffff" opacity="0.05" rx="4"/>
  <text x="400" y="925" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#93c5fd">info@hdmtechnologies.com</text>
  <text x="400" y="945" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#93c5fd">+254 768 784 909</text>

  <!-- Bottom tagline -->
  <text x="400" y="1030" text-anchor="middle" font-family="Georgia, serif" font-size="10" letter-spacing="4" fill="#1e6ef0">BUILDING DIGITAL SOLUTIONS FOR AFRICA</text>
</svg>