<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="lhGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1e6ef0"/>
    </linearGradient>
  </defs>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="800" height="6" fill="url(#lhGrad)"/>

  <!-- Logo placeholder circle -->
  <circle cx="70" cy="75" r="38" fill="none" stroke="#0a1628" stroke-width="3"/>
  <text x="70" y="85" text-anchor="middle" font-family="'Times New Roman', serif" font-size="28" font-weight="700" fill="#0a1628">H</text>

  <!-- Company name -->
  <text x="130" y="65" font-family="'Times New Roman', serif" font-size="28" font-weight="700" fill="#0a1628" letter-spacing="1">
    HDM TECHNOLOGIES
  </text>

  <!-- Tagline -->
  <text x="130" y="88" font-family="'Times New Roman', serif" font-size="12" font-style="italic" fill="#4b5563">
    Building Digital Solutions for Africa
  </text>

  <!-- Address line -->
  <text x="130" y="112" font-family="'Times New Roman', serif" font-size="11" fill="#374151">
    P.O. BOX 2460-20100, NAKURU, KENYA
  </text>

  <!-- Email line -->
  <text x="130" y="130" font-family="'Times New Roman', serif" font-size="11" fill="#1e6ef0">
    info@hdm.co.ke  ·  www.hdm.co.ke
  </text>

  <!-- Phone line -->
  <text x="130" y="148" font-family="'Times New Roman', serif" font-size="11" fill="#374151">
    +254 768 784 909
  </text>

  <!-- Bottom divider -->
  <line x1="40" y1="175" x2="760" y2="175" stroke="#0a1628" stroke-width="1.5"/>
  <line x1="40" y1="180" x2="760" y2="180" stroke="#1e6ef0" stroke-width="0.5"/>
</svg>